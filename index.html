<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Space Invaders</title>
        <link rel="icon" href="images/icon128.png" />
    </head>
<body>
    <div id="GameContainer"></div>

    <div id="GameMenu">
        <ul id="GameMenu-first">
            <li id="Restart" class="button">Restart</li>
            <li id="Mute" class="button">Mute</li>
            <li>Score: <span id="Score" class="value"></span></li>
            <li>Lives: <span id="Lives" class="value"></span></li>
        </ul>
        <ul id="GameMenu-second">
            <li>High-score: <span id="HighScore" class="value"></span></li>
            <li id="Timer"></li>
        </ul>
        <a id="DonateButton" class="button" href="http://nbpt.eu/donate/" target="_blank">Donate</a>
    </div>

    <script type="module" src="/scripts/main.ts"></script>
</body>
</html>
